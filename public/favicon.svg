<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="더소통컴퍼니, 서로 마주한 두 사람이 연결되는 기업 소통 심볼">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#A7D8FF"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Faces: two equal-size people, different tones for individuality -->
  <circle cx="19.4" cy="21.8" r="5.7" fill="#FFFFFF"/>
  <circle cx="44.6" cy="21.8" r="5.7" fill="#B5DDFF"/>
  <!-- Their arms meet in a single clear connection: no book, bubbles, arrows or decorative lines -->
  <path d="M11.6 46.5 C11.4 39.4 14.7 34.0 20.1 34.0 C25.3 34.0 27.9 40.3 32 43.4" fill="none" stroke="#FFFFFF" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52.4 46.5 C52.6 39.4 49.3 34.0 43.9 34.0 C38.7 34.0 36.1 40.3 32 43.4" fill="none" stroke="#B5DDFF" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
